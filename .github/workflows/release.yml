# Every push to main that carries a feat/fix/perf/refactor/revert/build (or breaking) commit is
# tagged with the next semantic version and released. docs/chore/ci/test/style-only pushes aren't.
name: release

on:
  push:
    branches: [main]

# Serialize releases so two quick pushes can't compute and push the same tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: next version
        id: version
        run: echo "tag=$(./scripts/next-version.sh)" >> "$GITHUB_OUTPUT"
      - name: no release needed
        if: steps.version.outputs.tag == ''
        run: echo "No releasable commits since the last tag; skipping."
      # Tags pushed with GITHUB_TOKEN don't trigger other workflows, so GoReleaser runs here.
      - name: tag
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
      - uses: goreleaser/goreleaser-action@v6
        if: steps.version.outputs.tag != ''
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
